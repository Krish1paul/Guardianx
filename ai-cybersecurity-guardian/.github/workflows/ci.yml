name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Linter
        run: |
          python -m ruff check app/ tests/

      - name: Mypy Strict Type Check
        run: |
          python -m mypy app/ tests/

      - name: Pytest with Coverage Threshold
        env:
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-characters-long"
          ENVIRONMENT: "test"
        run: |
          python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80 tests/

      - name: Alembic Migration Check
        run: |
          python -m alembic check
