# A generic, single database configuration.

[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template used to generate migration file names.
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file.
timezone = UTC

# The output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# ---------------------------------------------------------------------------
# Database URL
# ---------------------------------------------------------------------------
# In development this is overridden by env.py reading DATABASE_URL from
# the environment (or .env file). The placeholder below is never used
# directly — it exists so Alembic doesn't complain about a missing key.
sqlalchemy.url = postgresql+psycopg://user:pass@localhost/dbname


[post_write_hooks]
# No post-write hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
