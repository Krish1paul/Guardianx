[project]
name = "ai-cybersecurity-guardian-backend"
version = "0.1.0"
description = "Backend for the AI Personal Cybersecurity Guardian platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.1.0",
    # PyJWT replaces python-jose (python-jose has open CVEs and is unmaintained since 2022).
    # JWT issuance/verification is implemented in M1; this declares the dependency now.
    "PyJWT[crypto]>=2.9.0",
    # Required by Pydantic EmailStr for RFC-compliant email validation.
    "email-validator>=2.1.0",
    # M3 — ML inference
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    # M5 — Production hardening (Redis rate limiting, token revocation, caching)
    "redis>=5.0.0",
    # M7 — File upload support
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio[trio]>=4.4.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
